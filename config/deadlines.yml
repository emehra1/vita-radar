  - id: gates-cambridge-us
    label: Gates Cambridge Scholarship (US round)
    org: Gates Cambridge Trust
    lane: fellowships
    status: active
    priority: normal
    url: https://www.gatescambridge.org/apply/
    verifiedOn: 2026-08-22
    # A UK deadline, so it must NOT inherit the America/New_York default.
    #
    # Left on the default this row rendered "15 Oct 2026" with no zone, which
    # reads as a local date to somebody in Boston. It is not: London's 15th ends
    # at 19:00 Eastern, so a submission at 21:00 Eastern on the 15th is late.
    #
    # Where the administering zone is genuinely uncertain, prefer the EARLIER
    # interpretation, which is the same rule the parser follows. A London
    # midnight arrives before an Eastern one, so assuming London can only ever
    # make the tracker early. Being early is free; being late costs a cycle.
    timeZone: Europe/London
    eligibility:
      notes: >
        Requires a SEPARATE application to a Cambridge MPhil or PhD with its own
        deadline. Target the 1-year MPhil: the 3-year PhD does not fit a Fall
        2029 MD/PhD matriculation. Structurally awkward for the master plan —
        the clean version is MPhil then an RA year.
    cycles:
      - year: 2027
        deadline: 2026-10-15
        confirmed: false          # "mid-October" from your notes; /apply/ 302s to a broken root
        precision: day
        verifyBy: 2026-09-01
        steps:
          - id: cambridge-course-app
            label: University of Cambridge MPhil application (separate deadline)
            gating: true
            precision: month
            note: >
              Its own earlier deadline, course-dependent. Gates cannot be won
              without it. Verify the specific MPhil's date.
          - id: gates-app
            label: Gates Cambridge application
            due: 2026-10-15
            gating: true
            precondition: cambridge-course-app
    recurrence: { cadence: annual, anchor: "10-15" }

