          - id: national-app
            label: National application (Rhodes portal)
            due: 2026-10-07
            timeOfDay: "23:59"
            gating: true
            precondition: harvard-endorsement
            note: >
              23:59 ET is the historical close and is carried over, NOT confirmed
              — "October 7th" does not specify a time. Worth two minutes on the
              portal, because the failure mode is submitting on the right day and
              still being late. Rhodes House is in Oxford; if the portal turns out
              to run on UK time, 23:59 BST is 18:59 ET and the margin is five
              hours smaller than it looks.
