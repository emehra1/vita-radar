# ─────────────────────────────────────────────────────────────────────────────
#  THE file you edit. Everything else in this repo is downstream of it.
#
#  THE ONE RULE: this file is the source of truth for every date. Scrapers and
#  Claude are change-detectors layered on top. They may raise a flag; they may
#  never write a date. A model may move a date toward a human, never toward an
#  alert.
#
#  Why it is hand-maintained and not scraped, from live probes on 2026-08-22:
#    · rhodeshouse.ox.ac.uk renders fine and states NO DATE — just
#      "Applications for the Rhodes Scholarship 2027 are open!"
#    · rhodesscholar.org/applying-for-the-scholarship 301s to a different
#      domain; the date is in a PDF, three hops in.
#    · gatescambridge.org/apply/ 302s to http://www.gatescambridge.org/// —
#      downgraded scheme, triple slash, lands on the homepage. A scraper
#      following redirects extracts nothing and reports zero.
#    · nucleate.org says "Deadline for US chapters is October 21st" — no year —
#      directly beside a "2024 COHORT" block.
#    · uraf.harvard.edu returns a hard WAF 403 on EVERY path including
#      robots.txt. Harvard-internal endorsement deadlines exist on no
#      machine-readable host anywhere on the internet.
#    · agingpharma.org/registration says "The deadline is August 31, and
#      decisions will be announced in September." No year printed.
#
#  These are ~45 rows that change once a year. Scraping them trades an hour a
#  year of typing for an unbounded, unfalsifiable, silent-failure risk.
#
#  EDITING RULES
#    confirmed: true   only when a human read the page and the date is explicit.
#                      Scored at full urgency. May ring the subject line.
#    confirmed: false  a projection. Scored at 0.7x and can never outrank a
#                      confirmed date at the same distance. Renders "projected".
#    kind: unknown     there IS a deadline and we do not know it. NOT the same as
#                      rolling. Surfaces in the Verify block until resolved.
#    kind: rolling     genuinely no deadline. Delivered at most every 45 days.
#    precision: month  a date we only know to the month. CANNOT ring an alert.
#                      Never invent a day to make a row look tidy.
#
#    gating: true      missing this step ends the application. The T-minus ladder
#                      runs off the earliest unmet gating step, NOT the headline
#                      deadline. This is the field that earns the whole project.
#
#  After you verify a row by hand, update `verifiedOn`. Rows past
#  `verifyEvery` surface at the TOP of the email.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

defaults:
  timeZone: America/New_York
  verifyEvery: 90        # days
  horizonDays: 400

