        deadline: 2026-10-07
        confirmed: true
        timeOfDay: "23:59"
        precision: day
        steps:
          - id: harvard-endorsement
            label: Harvard institutional endorsement (URAF / OUE)
            gating: true
            status: done          # obtained 2026-09-06
